[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tools"
version = "1.0.0"
description = "审计自动化工具包 - 函证地址核查 / 关联方识别 / 折旧测算 / 凭证清洗"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhang53808" }]
keywords = ["audit", "accounting", "confirmation", "related-party", "depreciation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=1.3",
    "openpyxl>=3.0",
    "thefuzz>=0.20",
    "python-Levenshtein>=0.21",
    "requests>=2.25",
    "python-dotenv>=0.19",
    "tqdm>=4.60",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
audit-tools = "audit_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
